name: MC 24/7 No Secret
on:
  workflow_dispatch:
jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: |
          wget -O paper.jar https://api.papermc.io/v2/projects/paper/versions/1.21.1/builds/132/downloads/paper-1.21.1-132.jar
          echo "eula=true" > eula.txt
          java -Xmx2G -Xms1G -jar paper.jar nogui &
          ss -tlnp
          sleep 20
          ssh -o StrictHostKeyChecking=no -R 25565:localhost:25565 nokey@localhost.run
