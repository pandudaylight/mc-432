name: MC FINAL
on:
  workflow_dispatch:
jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Prepare server directory
        run: mkdir -p server

      - name: Restore world cache
        uses: actions/cache@v4
        id: cache_restore
        with:
          path: |
            server/world
            server/world_nether
            server/world_the_end
          key: mc-data-v2-${{ github.run_id }}
          restore-keys: |
            mc-data-v1-

      - name: Restore artifact backup
        uses: actions/download-artifact@v4
        with:
          name: mc-backup
          path: server
        continue-on-error: true

      - name: Check what loaded
        run: |
          echo "Cache hit: ${{ steps.cache_restore.outputs.cache-hit }}"
          find server -name "level.dat" 2>/dev/null || echo "No level.dat - first time"
          ls -lh server/world/ 2>/dev/null | head -n 10 || echo "world empty"
          if [ -f server/world/level.dat ]; then echo "[LOAD OK] ✅"; else echo "[NEW]"; fi

      - name: Download server jar
        run: |
          cd server
          if [ ! -f server.jar ]; then
            curl -L -o server.jar https://api.purpurmc.org/v2/purpur/1.21.10/latest/download
          fi
          echo "eula=true" > eula.txt
          cat > server.properties << 'EOF'
          online-mode=false
          level-name=world
          enable-command-block=true
          spawn-protection=0
          view-distance=10
          simulation-distance=8
          max-players=10
          EOF
          echo '[{"name":"saad5120","level":4}]' > ops.json

      - name: Run server
        env:
          SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          cd server
          rm -f /tmp/mc-input
          mkfifo /tmp/mc-input
          exec 3<> /tmp/mc-input

          java -Xmx3G -Xms1G -jar server.jar nogui < /tmp/mc-input &
          SERVER_PID=$!

          echo "Waiting 80 sec for world gen..."
          sleep 80
          find . -name "level.dat" 2>/dev/null || true
          ls -lh world/ 2>/dev/null | head || true

          (while kill -0 $SERVER_PID 2>/dev/null; do echo "save-all" > /tmp/mc-input; echo "op saad5120" > /tmp/mc-input; sleep 30; done) &

          curl -L -o playit https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64
          chmod +x playit
          ./playit --secret "$SECRET" || sleep 1800

          echo "Stopping server properly..."
          echo "save-all" >&3 || echo "save-all" > /tmp/mc-input
          sleep 5
          echo "stop" >&3 || echo "stop" > /tmp/mc-input
          sleep 20
          kill $SERVER_PID 2>/dev/null || true

      - name: Final check before save
        if: always()
        run: |
          echo "=== FINAL ==="
          find server -name "level.dat" 2>/dev/null || true
          ls -lh server/world/ 2>/dev/null | head || true
          du -sh server/world/ 2>/dev/null || true

      - name: Save artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-backup
          path: |
            server/world
            server/world_nether
            server/world_the_end
          overwrite: true
          retention-days: 30
