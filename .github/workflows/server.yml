        run: |
          echo "=== FINAL WORLD CHECK ==="
          if [ -p /tmp/mc-input ]; then
            echo "save-all flush" > /tmp/mc-input || true
            sleep 5
          fi
          find server -name "level.dat" 2>/dev/null || true
          du -sh server/world 2>/dev/null || true
          ls -lah server/world 2>/dev/null | head -n 20 || true

      # 3) Save world as artifact backup
      - name: Save World ARTIFACT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-world
          path: |
            server/world
            server/world_nether
            server/world_the_end
          overwrite: true
          retention-days: 30
