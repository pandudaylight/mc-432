name: MC 1.21.11 FIXED
on:
  workflow_dispatch:
jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache
        uses: actions/cache@v4
        with:
          path: server
          key: mc-12111-via-fixed
          restore-keys: mc-12111-

      - name: Run
        env:
          SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          mkdir -p server/plugins
          cd server

          if [ ! -f "paper.jar" ]; then
            echo "Downloading 1.21.11..."
            curl -L -o paper.jar https://api.purpurmc.org/v2/purpur/1.21.11/latest/download
            # agar 1.21.11 abhi na ho to 1.21.10 le lega taaki tera client direct join kar sake
            if [ $(stat -c%s paper.jar 2>/dev/null || echo 0) -lt 1000000 ]; then
              curl -L -o paper.jar https://api.purpurmc.org/v2/purpur/1.21.10/latest/download
            fi
          fi

          cd plugins
          rm -f ViaVersion.jar ViaBackwards.jar

          # ViaVersion - 3 link try karega
          curl -L -o ViaVersion.jar https://hangar.papermc.io/api/v1/projects/ViaVersion/ViaVersion/latestrelease/download || \
          curl -L -o ViaVersion.jar https://github.com/ViaVersion/ViaVersion/releases/latest/download/ViaVersion.jar || \
          curl -L -o ViaVersion.jar https://hangarcdn.papermc.io/plugins/ViaVersion/ViaVersion/versions/5.1.1/PAPER/ViaVersion-5.1.1.jar

          # ViaBackwards - 3 link try
          curl -L -o ViaBackwards.jar https://hangar.papermc.io/api/v1/projects/ViaVersion/ViaBackwards/latestrelease/download || \
          curl -L -o ViaBackwards.jar https://github.com/ViaVersion/ViaBackwards/releases/latest/download/ViaBackwards.jar || \
          curl -L -o ViaBackwards.jar https://hangarcdn.papermc.io/plugins/ViaVersion/ViaBackwards/versions/5.1.1/PAPER/ViaBackwards-5.1.1.jar

          # Baaki plugins sirf pehli baar
          [ ! -f Geyser.jar ] && curl -L -o Geyser.jar https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
          [ ! -f floodgate.jar ] && curl -L -o floodgate.jar https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
          [ ! -f EssentialsX.jar ] && curl -L -o EssentialsX.jar https://github.com/EssentialsX/Essentials/releases/download/2.21.2/EssentialsX-2.21.2.jar
          [ ! -f Vault.jar ] && curl -L -o Vault.jar https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar
          [ ! -f WorldEdit.jar ] && curl -L -o WorldEdit.jar https://hangarcdn.papermc.io/plugins/EngineHub/WorldEdit/versions/7.3.11/PAPER/WorldEdit-Bukkit-7.3.11.jar
          [ ! -f GriefPrevention.jar ] && curl -L -o GriefPrevention.jar https://hangarcdn.papermc.io/plugins/Big_Scary/GriefPrevention/versions/16.18.0/PAPER/GriefPrevention-16.18.0.jar
          [ ! -f CoreProtect.jar ] && curl -L -o CoreProtect.jar https://hangarcdn.papermc.io/plugins/CoreProtect/CoreProtect/versions/22.4/PAPER/CoreProtect-22.4.jar
          [ ! -f GSit.jar ] && curl -L -o GSit.jar https://hangarcdn.papermc.io/plugins/Gecolay/GSit/versions/7.0.0.0/PAPER/GSit-7.0.0.0.jar

          echo "=== FINAL PLUGIN CHECK ==="
          ls -lh | grep -E "Via|Geyser|Essentials"
          echo "ViaVersion size: $(stat -c%s ViaVersion.jar) bytes"
          echo "ViaBackwards size: $(stat -c%s ViaBackwards.jar) bytes"
          cd ..

          [ ! -f eula.txt ] && echo "eula=true" > eula.txt
          [ ! -f server.properties ] && echo -e "online-mode=false\nserver-port=25565" > server.properties

          java -Xmx5G -Xms2G -jar paper.jar nogui &
          sleep 35

          cd ..
          curl -L -o playit https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64
          chmod +x playit
          echo "IP: olds-growers.tun.ply.gg - 1.21.10 client can join 1.21.11 now"
          ./playit --secret $SECRET
