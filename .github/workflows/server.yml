name: MC Direct IP No Localhost
on:
  workflow_dispatch:
jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: |
            paper.jar
            plugins
            world
          key: mc-direct-v13
      - name: Run
        run: |
          [ -f paper.jar ] || curl -L -o paper.jar https://api.purpurmc.org/v2/purpur/1.21.1/latest/download
          mkdir -p plugins
          [ -f plugins/Geyser-Spigot.jar ] || curl -L -o plugins/Geyser-Spigot.jar https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
          [ -f plugins/floodgate-spigot.jar ] || curl -L -o plugins/floodgate-spigot.jar https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          echo "view-distance=4" >> server.properties
          java -Xmx1G -jar paper.jar nogui &
          sleep 25
          echo "=== DIRECT MC IP NICHE HAI ==="
          ssh -o StrictHostKeyChecking=no -p 443 -R0:localhost:25565 tcp@a.pinggy.io
