name: MC FINAL 6GB ALL PLUGINS
on:
  workflow_dispatch:

jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache World & Jars
        uses: actions/cache@v4
        with:
          path: server
          key: mc-v3-all-plugins
          restore-keys: mc-v3-

      - name: Run Server
        env:
          SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          mkdir -p server/plugins
          cd server

          if [ ! -f "paper.jar" ]; then
            echo "Downloading Purpur 1.21.11..."
            curl -L -o paper.jar https://api.purpurmc.org/v2/purpur/1.21.11/latest/download || curl -L -o paper.jar https://api.purpurmc.org/v2/purpur/1.21.1/latest/download
          else
            echo "paper.jar cache se loaded"
          fi

          cd plugins
          echo "Cleaning old fails..."
          rm -f ViaVersion.jar ViaBackwards.jar

          echo "Downloading 10 Plugins..."
          curl -L -o Geyser.jar https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
          curl -L -o floodgate.jar https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
          curl -L -o EssentialsX.jar https://github.com/EssentialsX/Essentials/releases/download/2.21.2/EssentialsX-2.21.2.jar
          curl -L -o Vault.jar https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar

          # FIXED - Ye 2 ab 100% honge
          curl -L -o ViaVersion.jar https://hangarcdn.papermc.io/plugins/ViaVersion/ViaVersion/versions/5.3.2/PAPER/ViaVersion-5.3.2.jar
          curl -L -o ViaBackwards.jar https://hangarcdn.papermc.io/plugins/ViaVersion/ViaBackwards/versions/5.3.2/PAPER/ViaBackwards-5.3.2.jar
          
          curl -L -o WorldEdit.jar https://hangarcdn.papermc.io/plugins/EngineHub/WorldEdit/versions/7.3.11/PAPER/WorldEdit-Bukkit-7.3.11.jar
          curl -L -o GriefPrevention.jar https://hangarcdn.papermc.io/plugins/Big_Scary/GriefPrevention/versions/16.18.0/PAPER/GriefPrevention-16.18.0.jar
          curl -L -o CoreProtect.jar https://hangarcdn.papermc.io/plugins/CoreProtect/CoreProtect/versions/22.4/PAPER/CoreProtect-22.4.jar
          curl -L -o GSit.jar https://hangarcdn.papermc.io/plugins/Gecolay/GSit/versions/7.0.0.0/PAPER/GSit-7.0.0.0.jar

          echo "=== PLUGINS LIST ==="
          ls -lh
          cd ..

          [ ! -f eula.txt ] && echo "eula=true" > eula.txt
          [ ! -f server.properties ] && echo -e "online-mode=false\nmotd=6GB Ultimate\nmax-players=20\nview-distance=6" > server.properties

          echo "Starting with 5GB RAM..."
          java -Xmx5G -Xms2G -XX:+UseG1GC -jar paper.jar nogui &
          sleep 30

          cd ..
          curl -L -o playit https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64
          chmod +x playit
          echo "=============================="
          echo "PERMANENT IP: olds-growers.tun.ply.gg"
          echo "RAM: 5GB | 6 HOUR | ALL PLUGINS OK"
          echo "=============================="
          ./playit --secret $SECRET
