name: MC 24/7 Fixed World
on:
  workflow_dispatch:
jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Jar and World
        uses: actions/cache@v4
        with:
          path: |
            paper.jar
            plugins
            world
            world_nether
            world_the_end
          key: mc-world-save-1.21.1-v5
          restore-keys: |
            mc-world-save-1.21.1-

      - name: Start Server
        run: |
          mkdir -p plugins
          if [ ! -f paper.jar ]; then
            curl -L -o paper.jar https://api.purpurmc.org/v2/purpur/1.21.1/latest/download
          fi
          if [ ! -f plugins/EssentialsX.jar ]; then
            curl -L -o plugins/Geyser-Spigot.jar https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
            curl -L -o plugins/floodgate-spigot.jar https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
            curl -L -o plugins/EssentialsX.jar https://github.com/EssentialsX/Essentials/releases/download/2.21.2/EssentialsX-2.21.2.jar
            curl -L -o plugins/Vault.jar https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar
          fi

          echo "eula=true" > eula.txt
          # Low load settings
          cat > server.properties <<EOF
          online-mode=false
          server-port=25565
          view-distance=5
          simulation-distance=4
          max-players=10
          sync-chunk-writes=false
          EOF

          java -Xmx2048M -Xms1024M --add-modules=jdk.incubator.vector -jar paper.jar nogui &
          
          sleep 40
          echo "=== SERVER IS UP ==="
          ss -tlnp | grep 25565
          
          # Tunnel - ye wala port hamesha khali milta hai
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 25565:localhost:25565 nokey@localhost.run
