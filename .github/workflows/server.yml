name: MC Permanent Playit FIXED
on:
  workflow_dispatch:
jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: |
            paper.jar
            plugins
            world
          key: mc-perm-fixed-v15
      - name: Run
        run: |
          [ -f paper.jar ] || curl -L -o paper.jar https://api.purpurmc.org/v2/purpur/1.21.1/latest/download
          mkdir -p plugins
          [ -f plugins/Geyser-Spigot.jar ] || curl -L -o plugins/Geyser-Spigot.jar https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
          [ -f plugins/floodgate-spigot.jar ] || curl -L -o plugins/floodgate-spigot.jar https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          java -Xmx1G -jar paper.jar nogui &
          sleep 20
          # Sahi download link
          curl -L --retry 10 -o playit https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64
          ls -lh playit
          chmod +x playit
          echo "=== CLAIM LINK NICHE AAYEGA ==="
          ./playit
