name: MC FINAL
on:
  workflow_dispatch:
jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore World
        uses: actions/download-artifact@v4
        with:
          name: mc-world
          path: server/world
        continue-on-error: true

      - name: Check Load
        run: |
          mkdir -p server/world
          if [ -f server/world/level.dat ]; then echo "[LOAD OK] ✅ World loaded $(du -sh server/world)"; ls server/world/ || true; else echo "[NEW] First time"; fi

      - name: Run Server
        env:
          SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          cd server
          if [ ! -f server.jar ]; then curl -L -o server.jar https://api.purpurmc.org/v2/purpur/1.21.10/latest/download; fi
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          echo '[{"name":"saad5120","level":4}]' > ops.json

          rm -f /tmp/mc-input && mkfifo /tmp/mc-input
          exec 3<> /tmp/mc-input
          java -Xmx3G -Xms1G -jar server.jar nogui < /tmp/mc-input &
          PID=$!
          sleep 60
          if kill -0 $PID 2>/dev/null; then echo "✅ Server RUNNING"; else cat logs/latest.log | tail -n 100; exit 1; fi
          ls -lh world/ || true
          ls -lh world_nether/ || true
          echo "save-all" > /tmp/mc-input
          sleep 3
          ls -lh world/ || true

          (while kill -0 $PID 2>/dev/null; do echo "save-all" > /tmp/mc-input; echo "op saad5120" > /tmp/mc-input; sleep 30; done) &
          cd ..
          curl -L -o playit https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64
          chmod +x playit
          ./playit --secret $SECRET || sleep 1800

      - name: Final Save
        if: always()
        run: |
          echo "Final save-all..."
          echo "save-all" > /tmp/mc-input || true
          sleep 5
          echo "=== WORLD ==="; ls -lh server/world/ || true
          echo "=== ROOT ==="; ls -lh server/ | grep -E "world|level" || true

      - name: Upload World
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-world
          path: |
            server/world
            server/world_nether
            server/world_the_end
          overwrite: true
