name: MC FINAL
on:
  workflow_dispatch:
jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Check Secret Exists
        env:
          SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then echo "❌ ERROR: PLAYIT_SECRET is MISSING! Go to Settings > Secrets > New secret > PLAYIT_SECRET"; else echo "✅ SECRET OK len=${#SECRET}"; fi

      - name: Restore World
        uses: actions/download-artifact@v4
        with:
          name: mc-world
          path: server/world
        continue-on-error: true

      - name: Run Server
        env:
          SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          mkdir -p server/plugins
          mkdir -p server/world
          cd server
          echo "Downloading server.jar if needed..."
          if [ ! -f server.jar ]; then curl -L --retry 3 -o server.jar https://api.purpurmc.org/v2/purpur/1.21.10/latest/download; fi
          ls -lh server.jar
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          echo '[{"name":"saad5120","level":4}]' > ops.json
          
          if [ -f world/level.dat ]; then echo "[LOAD OK] World exists $(du -sh world)"; else echo "[NEW] Creating new world..."; fi

          rm -f /tmp/mc-input && mkfifo /tmp/mc-input
          exec 3<> /tmp/mc-input
          java -Xmx3G -Xms1G -jar server.jar nogui < /tmp/mc-input &
          PID=$!
          echo "Server PID $PID"

          echo "Waiting 20 sec for server start..."
          sleep 20
          if kill -0 $PID 2>/dev/null; then echo "✅ Server RUNNING"; else echo "❌ Server FAILED TO START"; echo "--- logs/latest.log ---"; cat logs/latest.log 2>/dev/null | tail -n 100; exit 1; fi

          echo "Waiting 40 sec more for world gen..."
          sleep 40
          ls -lh world/ | head -n 20
          if [ ! -f world/level.dat ]; then echo "❌ level.dat still not found"; cat logs/latest.log | tail -n 50; fi

          (while kill -0 $PID 2>/dev/null; do echo "save-all" > /tmp/mc-input; echo "op saad5120" > /tmp/mc-input; sleep 30; done) &
          
          cd ..
          if [ -z "$SECRET" ]; then
            echo "⚠️ SECRET missing, running server WITHOUT playit for 30 min to test world save"
            sleep 1800
          else
            echo "Starting Playit..."
            curl -L -o playit https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64
            chmod +x playit
            ./playit --secret $SECRET || (echo "Playit crashed, keeping server alive 30 min"; sleep 1800)
          fi

      - name: Final World Check
        if: always()
        run: |
          echo "=== FINAL WORLD ==="
          ls -R server/world 2>&1 | head -n 100
          du -sh server/world || echo "NO WORLD FOLDER"
          mkdir -p world_backup
          cp -r server/world/* world_backup/ 2>/dev/null || true
          ls -lh world_backup | head

      - name: Upload World
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-world
          path: server/world
          if-no-files-found: warn
          overwrite: true
