name: MC ULTIMATE FIXED
on:
  workflow_dispatch:
jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache
        uses: actions/cache@v4
        with:
          path: server
          key: mc-ultimate-v2
          restore-keys: mc-ultimate-

      - name: Run
        env:
          SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          mkdir -p server/plugins
          cd server

          if [ ! -f "paper.jar" ]; then
            echo "Downloading 1.21.11..."
            curl -L -o paper.jar https://api.purpurmc.org/v2/purpur/1.21.11/latest/download || curl -L -o paper.jar https://api.purpurmc.org/v2/purpur/1.21.1/latest/download
          fi

          cd plugins
          # Force fresh download
          rm -f *.jar

          echo "Downloading Plugins..."
          curl -L -o Geyser.jar https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
          curl -L -o floodgate.jar https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
          curl -L -o EssentialsX.jar https://github.com/EssentialsX/Essentials/releases/download/2.21.2/EssentialsX-2.21.2.jar
        
          curl -L -o Vault.jar https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar
          curl -L -o GSit.jar https://cdn.modrinth.com/data/4aX7aP9e/versions/TqS1D3gP/GSit-7.0.0.0.jar
          curl -L -o CoreProtect.jar https://cdn.modrinth.com/data/6eMEw2Ct/versions/A00IijcZ/coreprotect-22.4.jar
          curl -L -o GriefPrevention.jar https://cdn.modrinth.com/data/M5iDUc2T/versions/8iEwWq7A/GriefPrevention-16.18.jar
          curl -L -o WorldEdit.jar https://cdn.modrinth.com/data/1u6JkXh5/versions/vz8aG7wN/worldedit-bukkit-7.3.11.jar
         curl -L -o ViaVersion.jar https://cdn.modrinth.com/data/P1OZGk5p/versions/L7v7Mf9N/ViaVersion-5.4.2.jar
          curl -L -o ViaBackwards.jar https://cdn.modrinth.com/data/NpMmpW5M/versions/9gQj3kL2/ViaBackwards-5.4.2.jar
          ls -lh
          cd ..
          [ ! -f eula.txt ] && echo "eula=true" > eula.txt
          [ ! -f server.properties ] && echo "online-mode=false" > server.properties

          java -Xmx5G -Xms2G -jar paper.jar nogui &
          sleep 30

          cd ..
          curl -L -o playit https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64
          chmod +x playit
          echo "IP: olds-growers.tun.ply.gg"
          ./playit --secret $SECRET
