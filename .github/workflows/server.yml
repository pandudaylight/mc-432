name: MC FINAL
on:
  workflow_dispatch:
jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore Jars
        uses: actions/cache@v4
        with:
          path: |
            server/server.jar
            server/plugins
          key: mc-jars-v4

      - name: Restore World
        uses: actions/download-artifact@v4
        with:
          name: mc-world
          path: server/world
        continue-on-error: true

      - name: Check Load
        run: |
          echo "=== BEFORE RUN ==="
          mkdir -p server/world
          mkdir -p server/world_backup
          mkdir -p world_backup
          if [ -f server/world/level.dat ]; then echo "[LOAD OK] $(du -sh server/world)"; else echo "[LOAD] First time - new world will be created, wait 60 sec after start"; fi
          ls -lh server/world || echo "world empty - will be created"

      - name: Run
        env:
          SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          cd server
          if [ ! -f server.jar ]; then curl -sSL -o server.jar https://api.purpurmc.org/v2/purpur/1.21.10/latest/download; fi
          cd plugins
          for jar in ViaVersion ViaBackwards Geyser floodgate EssentialsX Vault; do if [ ! -f ${jar}.jar ]; then echo "Downloading $jar"; fi; done
          if [ ! -f ViaVersion.jar ]; then curl -sSL -o ViaVersion.jar $(curl -sSL https://api.github.com/repos/ViaVersion/ViaVersion/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1); fi
          if [ ! -f ViaBackwards.jar ]; then curl -sSL -o ViaBackwards.jar $(curl -sSL https://api.github.com/repos/ViaVersion/ViaBackwards/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1); fi
          if [ ! -f Geyser.jar ]; then curl -sSL -o Geyser.jar https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot; fi
          if [ ! -f floodgate.jar ]; then curl -sSL -o floodgate.jar https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot; fi
          if [ ! -f EssentialsX.jar ]; then curl -sSL -o EssentialsX.jar https://github.com/EssentialsX/Essentials/releases/download/2.21.2/EssentialsX-2.21.2.jar; fi
          if [ ! -f Vault.jar ]; then curl -sSL -o Vault.jar https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar; fi
          cd ..
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          echo '[{"uuid":"00000000-0000-0000-0000-000000000000","name":"saad5120","level":4}]' > ops.json

          rm -f /tmp/mc-input && mkfifo /tmp/mc-input
          tail -f /tmp/mc-input | java -Xmx5G -Xms2G -jar server.jar nogui &
          PID=$!
          trap 'echo "save-all" > /tmp/mc-input; sleep 5; echo "[TRAP] Saving..."; ls -lh world/ | head; cp -r world world_backup 2>/dev/null; cp -r world ../world_backup 2>/dev/null; cp -r world ../server/world 2>/dev/null || true' EXIT TERM INT

          echo "Waiting 50 sec for world to generate..."
          sleep 50
          echo "World after 50 sec:"; ls -lh world/ | head -n 20

          (while true; do echo "op saad5120" > /tmp/mc-input; echo "save-all" > /tmp/mc-input; cp -r world world_backup 2>/dev/null; cp -r world ../world_backup 2>/dev/null; sleep 30; done) &

          cd ..
          curl -sSL -o playit https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64
          chmod +x playit
          ./playit --secret $SECRET

      - name: Final Backup Copy
        if: always()
        run: |
          echo "=== AFTER RUN ==="
          ls -lh server/world/ | head -n 20
          echo "Copying to backup folders..."
          cp -r server/world server/world_backup 2>/dev/null || echo "copy 1 failed"
          cp -r server/world world_backup 2>/dev/null || echo "copy 2 failed"
          echo "world_backup size $(du -sh server/world_backup)"
          echo "root backup size $(du -sh world_backup)"
          ls -lh world_backup/ | head -n 10 || echo "root backup empty"

      - name: Save World - FOR LOAD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-world
          path: server/world
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: Save File Backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-world-file-backup
          path: world_backup
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
