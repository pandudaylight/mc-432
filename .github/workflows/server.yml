name: MC PERMANENT FINAL
on:
  workflow_dispatch:
jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run
        env:
          SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          curl -L -o paper.jar https://api.purpurmc.org/v2/purpur/1.21.1/latest/download
          mkdir -p plugins
          curl -L -o plugins/Geyser-Spigot.jar https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
          curl -L -o plugins/floodgate-spigot.jar https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          java -Xmx2G -jar paper.jar nogui &
          sleep 15
          curl -L -o playit https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64
          chmod +x playit
          echo "=== PERMANENT IP ==="
          echo "olds-gallons.tun.ply.gg"
          ./playit --secret $SECRET
