name: MC FINAL

on:
  workflow_dispatch:

jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Prepare server directory
        run: mkdir -p server

      - name: Restore world cache
        uses: actions/cache@v4
        id: cache_restore
        with:
          path: |
            server/world
            server/world_nether
            server/world_the_end
            server/plugins
          key: mc-data-v1

      - name: Restore artifact backup
        if: steps.cache_restore.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: mc-backup
          path: server
        continue-on-error: true

      - name: Download server jar
        run: |
          cd server
          if [ ! -f server.jar ]; then
            curl -L -o server.jar https://api.purpurmc.org/v2/purpur/1.21.10/latest/download
          fi
          echo "eula=true" > eula.txt
          cat > server.properties << 'EOF'
          online-mode=false
          level-name=world
          enable-command-block=true
          spawn-protection=0
          view-distance=10
          simulation-distance=8
          max-players=10
          EOF

      - name: Run server
        env:
          SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          cd server
          rm -f /tmp/mc-input
          mkfifo /tmp/mc-input
          exec 3<> /tmp/mc-input

          java -Xmx3G -Xms1G -jar server.jar nogui < /tmp/mc-input &
          SERVER_PID=$!

          sleep 90

          curl -L -o playit https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64
          chmod +x playit
          ./playit --secret "$SECRET" &
          PLAYIT_PID=$!

          wait $PLAYIT_PID || sleep 1800

          echo "save-all" >&3
          sleep 5
          echo "save-all flush" >&3
          sleep 5
          echo "stop" >&3
          sleep 15

          kill $SERVER_PID 2>/dev/null || true

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            server/world
            server/world_nether
            server/world_the_end
            server/plugins
          key: mc-data-v1

      - name: Save artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-backup
          path: |
            server/world
            server/world_nether
            server/world_the_end
            server/plugins
          overwrite: true
          retention-days: 30
```
