name: MC FINAL
on:
  workflow_dispatch:
jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Restore CACHE
        uses: actions/cache@v4
        id: cache_restore
        with:
          path: |
            server/world
            server/world_nether
            server/world_the_end
            server/plugins
          key: mc-final-${{ github.run_id }}
          restore-keys: |
            mc-final-

      - name: Restore ARTIFACT
        uses: actions/download-artifact@v4
        with:
          name: mc-backup
          path: server
        continue-on-error: true

      - name: Check Load
        run: |
          mkdir -p server/plugins server/world
          echo "Cache: ${{ steps.cache_restore.outputs.cache-hit }}"
          find server -name "level.dat" 2>/dev/null || echo "First time"
          if [ -f server/world/level.dat ] || [ -f server/level.dat ]; then echo "[LOAD OK] ✅"; else echo "[NEW]"; fi

      - name: Download Plugins FIXED
        run: |
          cd server/plugins
          rm -f EssentialsX.jar GSit.jar Geyser-Spigot.jar floodgate-spigot.jar
          # Geyser + Floodgate - working
          curl -L -o Geyser-Spigot.jar https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
          curl -L -o floodgate-spigot.jar https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
          # EssentialsX - fixed direct link
          curl -L -o EssentialsX.jar https://github.com/EssentialsX/Essentials/releases/download/2.21.0/EssentialsX-2.21.0.jar
          # GSit - fixed direct link
          curl -L -o GSit.jar https://github.com/YouHaveTrouble/mc-gsit/releases/download/1.12.3/GSit-1.12.3.jar
          # Check size - corrupt check
          ls -lh
          for f in *.jar; do if [ $(stat -c%s "$f") -lt 50000 ]; then echo "Corrupt $f"; rm "$f"; fi; done

      - name: Download server + OP
        run: |
          cd server
          if [ ! -f server.jar ]; then curl -L -o server.jar https://api.purpurmc.org/v2/purpur/1.21.10/latest/download; fi
          echo "eula=true" > eula.txt
          cat > server.properties << 'EOF'
          online-mode=false
          level-name=world
          enable-command-block=true
          spawn-protection=0
          view-distance=10
          max-players=20
          EOF
          # OP saad5120 - 100% hoga ab
          echo '[{"uuid":"00000000-0000-0000-0000-000000000000","name":"saad5120","level":4,"bypassesPlayerLimit":true}]' > ops.json
          cat ops.json

      - name: Run server
        env:
          SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          cd server
          rm -f /tmp/mc-input && mkfifo /tmp/mc-input
          exec 3<> /tmp/mc-input
          java -Xmx3G -Xms1G -jar server.jar nogui < /tmp/mc-input &
          PID=$!
          sleep 90
          find . -name "level.dat" 2>/dev/null || true
          echo "op saad5120" > /tmp/mc-input
          (while kill -0 $PID 2>/dev/null; do echo "save-all" > /tmp/mc-input; sleep 30; done) &
          curl -L -o playit https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64
          chmod +x playit
          ./playit --secret "$SECRET" || sleep 1800
          echo "save-all" > /tmp/mc-input; sleep 5; echo "stop" > /tmp/mc-input; sleep 20

      - name: Final check
        if: always()
        run: |
          find server -name "level.dat" 2>/dev/null
          ls -lh server/plugins/ 2>/dev/null | head

      - name: Save ARTIFACT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-backup
          path: |
            server/world
            server/world_nether
            server/world_the_end
            server/plugins
            server/level.dat
          overwrite: true
