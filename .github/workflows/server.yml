name: MC FINAL FIX
on:
  workflow_dispatch:

jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache
        uses: actions/cache@v4
        with:
          path: server
          key: mc-final-v7
          restore-keys: |
            mc-final-

      - name: Run Server
        env:
          SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          sudo apt-get install -y jq > /dev/null 2>&1
          mkdir -p server/plugins
          cd server

          if [! -f paper.jar ]; then
            echo "Downloading Purpur 1.21.11"
            curl -L -o paper.jar https://api.purpurmc.org/v2/purpur/1.21.11/latest/download
          else
            echo "Skip paper.jar - cached"
          fi

          cd plugins

          if [! -f ViaVersion.jar ]; then
            V=$(curl -s https://api.modrinth.com/v2/project/P1OZGk5p/version | jq -r '.[0].files[0].url')
            curl -L -o ViaVersion.jar "$V"
          else
            echo "Skip ViaVersion - cached"
          fi

          if [! -f ViaBackwards.jar ]; then
            B=$(curl -s https://api.modrinth.com/v2/project/NpMmpW5M/version | jq -r '.[0].files[0].url')
            curl -L -o ViaBackwards.jar "$B"
          else
            echo "Skip ViaBackwards - cached"
          fi

          if [! -f Geyser.jar ]; then curl -L -o Geyser.jar https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot; fi
          if [! -f floodgate.jar ]; then curl -L -o floodgate.jar https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot; fi
          if [! -f EssentialsX.jar ]; then curl -L -o EssentialsX.jar https://github.com/EssentialsX/Essentials/releases/download/2.21.2/EssentialsX-2.21.2.jar; fi
          if [! -f Vault.jar ]; then curl -L -o Vault.jar https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar; fi
          if [! -f WorldEdit.jar ]; then curl -L -o WorldEdit.jar https://hangarcdn.papermc.io/plugins/EngineHub/WorldEdit/versions/7.3.11/PAPER/WorldEdit-Bukkit-7.3.11.jar; fi
          if [! -f GriefPrevention.jar ]; then curl -L -o GriefPrevention.jar https://hangarcdn.papermc.io/plugins/Big_Scary/GriefPrevention/versions/16.18.0/PAPER/GriefPrevention-16.18.0.jar; fi
          if [! -f CoreProtect.jar ]; then curl -L -o CoreProtect.jar https://hangarcdn.papermc.io/plugins/CoreProtect/CoreProtect/versions/22.4/PAPER/CoreProtect-22.4.jar; fi
          if [! -f GSit.jar ]; then curl -L -o GSit.jar https://hangarcdn.papermc.io/plugins/Gecolay/GSit/versions/7.0.0.0/PAPER/GSit-7.0.0.0.jar; fi

          ls -lh
          cd..

          if [! -f eula.txt ]; then echo "eula=true" > eula.txt; fi
          if [! -f server.properties ]; then echo "online-mode=false" > server.properties; fi

          java -Xmx5G -Xms2G -jar paper.jar nogui &
          sleep 30

          cd..
          curl -L -o playit https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64
          chmod +x playit
          echo "IP: olds-growers.tun.ply.gg"
         ./playit --secret $SECRET
