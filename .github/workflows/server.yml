name: MC 24/7 No Secret
on:
  workflow_dispatch:
jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Start Server
        run: |
          mkdir -p plugins
          if [ ! -f paper.jar ]; then
            curl -L -o paper.jar https://api.purpurmc.org/v2/purpur/1.21.1/latest/download
          fi
          rm -f plugins/EssentialsX.jar
          curl -L -o plugins/Geyser-Spigot.jar https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
          curl -L -o plugins/floodgate-spigot.jar https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
          curl -L -o plugins/EssentialsX.jar https://github.com/EssentialsX/Essentials/releases/download/2.21.2/EssentialsX-2.21.2.jar
          curl -L -o plugins/Vault.jar https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar
          
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          
          java -Xmx2048M -Xms1024M -jar paper.jar nogui &
          sleep 35
          ss -tlnp
          # Try 3 ports, jo khali hoga lag jayega
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R 32455:localhost:25565 nokey@localhost.run || ssh -o StrictHostKeyChecking=no -R 25565:localhost:25565 nokey@localhost.run || ssh -o StrictHostKeyChecking=no -R 25577:localhost:25565 nokey@localhost.run
