name: MC FINAL

on:
  workflow_dispatch:

jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache
        uses: actions/cache@v4
        with:
          path: server
          key: mc-final-10
          restore-keys: |
            mc-final-

      - name: Run
        env:
          SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq > /dev/null 2>&1
          mkdir -p server/plugins
          cd server

          if [ ! -f server.jar ]; then
            curl -sSL -H "User-Agent: Mozilla/5.0" -o server.jar https://api.purpurmc.org/v2/purpur/1.21.4/latest/download
          fi

          cd plugins

          # Dynamic GitHub API Jar Download
          VIAVER_URL=$(curl -sSL -H "User-Agent: Mozilla/5.0" https://api.github.com/repos/ViaVersion/ViaVersion/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          curl -sSL -H "User-Agent: Mozilla/5.0" -o ViaVersion.jar "$VIAVER_URL"

          VIABACK_URL=$(curl -sSL -H "User-Agent: Mozilla/5.0" https://api.github.com/repos/ViaVersion/ViaBackwards/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          curl -sSL -H "User-Agent: Mozilla/5.0" -o ViaBackwards.jar "$VIABACK_URL"

          curl -sSL -H "User-Agent: Mozilla/5.0" -o Geyser.jar https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
          curl -sSL -H "User-Agent: Mozilla/5.0" -o floodgate.jar https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot

          if [ ! -f EssentialsX.jar ]; then curl -sSL -H "User-Agent: Mozilla/5.0" -o EssentialsX.jar https://github.com/EssentialsX/Essentials/releases/download/2.21.2/EssentialsX-2.21.2.jar; fi
          if [ ! -f Vault.jar ]; then curl -sSL -H "User-Agent: Mozilla/5.0" -o Vault.jar https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar; fi
          if [ ! -f WorldEdit.jar ]; then curl -sSL -H "User-Agent: Mozilla/5.0" -o WorldEdit.jar https://hangarcdn.papermc.io/plugins/EngineHub/WorldEdit/versions/7.3.11/PAPER/WorldEdit-Bukkit-7.3.11.jar; fi
          if [ ! -f GriefPrevention.jar ]; then curl -sSL -H "User-Agent: Mozilla/5.0" -o GriefPrevention.jar https://hangarcdn.papermc.io/plugins/Big_Scary/GriefPrevention/versions/16.18.0/PAPER/GriefPrevention-16.18.0.jar; fi
          if [ ! -f CoreProtect.jar ]; then curl -sSL -H "User-Agent: Mozilla/5.0" -o CoreProtect.jar https://hangarcdn.papermc.io/plugins/CoreProtect/CoreProtect/versions/22.4/PAPER/CoreProtect-22.4.jar; fi
          if [ ! -f GSit.jar ]; then curl -sSL -H "User-Agent: Mozilla/5.0" -o GSit.jar https://hangarcdn.papermc.io/plugins/Gecolay/GSit/versions/7.0.0.0/PAPER/GSit-7.0.0.0.jar; fi

          cd ..

          if [ ! -f eula.txt ]; then echo "eula=true" > eula.txt; fi
          if [ ! -f server.properties ]; then echo "online-mode=false" > server.properties; fi

          java -Xmx5G -Xms2G -jar server.jar nogui &
          sleep 30

          cd ..

          curl -sSL -H "User-Agent: Mozilla/5.0" -o playit https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64
          chmod +x playit
          ./playit --secret $SECRET
