name: MC 24/7 No Secret
on:
  workflow_dispatch:
jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Start Server
        run: |
          curl -L -o paper.jar https://api.purpurmc.org/v2/purpur/1.21.1/latest/download
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          java -Xmx2048M -Xms1024M -jar paper.jar nogui &
          sleep 35
          ss -tlnp
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R 25565:localhost:25565 nokey@localhost.run
